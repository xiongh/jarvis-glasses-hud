<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="application-name" content="JARVIS HUD" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
    <title>JARVIS HUD</title>
  </head>
  <body>
    <main id="jarvis-glasses-hud" class="hud" aria-label="JARVIS glasses HUD">
      <header class="hud-header"><span class="brand">JARVIS</span><span class="online">● ONLINE</span></header>
      <p id="hud-update-status" class="hud-update-status" role="status" aria-live="polite"></p>
      <section id="hud-screen" class="hud-screen" aria-live="polite"></section>
      <p class="hint">ARROWS: NAVIGATE · ENTER: SELECT · ESC: BACK</p>
    </main>
    <script src="./youtube-player.js"></script>
    <script src="./connectors-config.js"></script>
    <script src="./connectors.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
